<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1210" />
    <!-- Added to a phone's home screen, the game opens full screen without browser bars. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wurst Case" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Wurst Case Scenario</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1210; overflow: hidden; }
      /* Touch screens: no pinch/double-tap zoom, pull-to-refresh, text selection or long-press menus mid-fight. */
      html, body, #game, canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #toast { position: fixed; top: 12px; left: 50%; transform: translate(-50%, -150%); z-index: 20; pointer-events: none;
        background: rgba(20, 13, 10, 0.92); color: #ffd9a0; border: 2px solid #ffb347; border-radius: 10px; padding: 8px 16px;
        font: 600 15px/1.3 "Trebuchet MS", "Segoe UI", sans-serif; transition: transform 0.25s ease-out; white-space: nowrap; }
      #toast.show { transform: translate(-50%, 0); }
      /* Phaser's Scale.CENTER_BOTH does the centring; don't also flex-centre or it shifts off-centre. */
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: auto; }
      /* Phones held upright: the game is landscape-only, so ask to rotate. */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #1a1210; color: #ffd9a0;
        font: 600 20px/1.4 "Trebuchet MS", "Segoe UI", sans-serif; text-align: center;
        flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; }
      #rotate .phone { width: 46px; height: 80px; border: 4px solid #ffd9a0; border-radius: 10px;
        animation: turn 1.6s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="rotate" role="alert"><div class="phone"></div>Turn your phone sideways to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
